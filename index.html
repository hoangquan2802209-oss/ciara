<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>@ciara</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">

<style>
:root { --white: #f8fbff; }
* { box-sizing: border-box; }

html, body {
    margin: 0;
    min-height: 100%;
    background: #03030a;
}

body {
    min-height: 100vh;
    color: var(--white);
    font-family: 'Inter', sans-serif;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
}

/* =========================================
   THREAD CURSOR - CHỈ HIỆN TRONG MAIN
   ========================================= */
#thread-canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 100;
    pointer-events: none;
    opacity: 0;
    visibility: hidden;
    transition: opacity .7s ease, visibility .7s ease;
}
body.in-main #thread-canvas { opacity: 1; visibility: visible; }


#network-canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 101;
    pointer-events: none;
    opacity: 0;
    visibility: hidden;
    transition: opacity .8s ease, visibility .8s ease;
}
body.in-main #network-canvas { opacity: .8; visibility: visible; }

/* CINEMATIC SPACE JUMP - STAR TUNNEL + PORTAL */
#warp-transition {
    position: fixed;
    inset: 0;
    z-index: 999;
    pointer-events: none;
    opacity: 0;
    visibility: hidden;
    overflow: hidden;
    isolation: isolate;
    background: radial-gradient(circle at center, #101a32 0%, #070d1d 30%, #020611 67%, #010208 100%);
}
#warp-transition.active { visibility: visible; animation: spaceScene 2.15s ease-in-out forwards; }
#warp-stars {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 2;
}
.warp-portal {
    position: absolute;
    left: 50%; top: 50%;
    width: min(42vw, 42vh);
    aspect-ratio: 1;
    border-radius: 50%;
    z-index: 3;
    opacity: 0;
    transform: translate(-50%,-50%) scale(.08);
    background: radial-gradient(circle, #ffffff 0%, #dcecff 1.5%, rgba(116,174,255,.5) 3%, rgba(31,72,160,.12) 8%, transparent 28%);
    box-shadow: 0 0 18px rgba(190,220,255,.5), 0 0 55px rgba(67,119,255,.18);
}
.warp-portal::before,
.warp-portal::after {
    content: "";
    position: absolute;
    inset: 12%;
    border: 1px solid rgba(220,237,255,.9);
    border-radius: 50%;
    box-shadow: 0 0 9px rgba(134,190,255,.48);
}
.warp-portal::after {
    inset: 23%;
    border-color: rgba(255,255,255,.72);
    border-style: dashed;
    filter: none;
}
#warp-transition.active .warp-portal { animation: portalOpen 2.15s cubic-bezier(.16,.72,.18,1) forwards; }
.warp-flash {
    position: absolute;
    z-index: 4;
    inset: 0;
    opacity: 0;
    background: radial-gradient(circle at center, rgba(255,255,255,.98) 0%, rgba(194,222,255,.8) 7%, rgba(105,157,255,.28) 23%, transparent 56%);
}
#warp-transition.active .warp-flash { animation: portalFlash 2.15s ease-out forwards; }
@keyframes spaceScene {
    0% { opacity: 0; }
    9%,72% { opacity: 1; }
    100% { opacity: 0; visibility: hidden; }
}
@keyframes portalOpen {
    0% { opacity: 0; transform: translate(-50%,-50%) scale(.08) rotate(-18deg); }
    18% { opacity: .9; }
    54% { opacity: 1; transform: translate(-50%,-50%) scale(.8) rotate(12deg); }
    78% { opacity: .95; transform: translate(-50%,-50%) scale(2.3) rotate(25deg); }
    100% { opacity: 0; transform: translate(-50%,-50%) scale(5.5) rotate(35deg); }
}
@keyframes portalFlash {
    0%,58% { opacity: 0; }
    72% { opacity: .85; }
    84% { opacity: .2; }
    100% { opacity: 0; }
}
@media (max-width: 700px) {
    .warp-portal { width: min(68vw, 42vh); }
}
@media (prefers-reduced-motion: reduce) {
    #warp-transition.active { animation-duration: 1.2s; }
    #warp-transition.active .warp-portal,
    #warp-transition.active .warp-flash { animation-duration: 1.2s; }
}

/* INTRO */
.intro {
    position: fixed;
    inset: 0;
    z-index: 10;
    background: #030303;
    display: grid;
    place-content: center;
    text-align: center;
    transition: opacity 1s ease, visibility 1s ease;
    cursor: pointer;
}

.intro.hide {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
}

.signature-wrapper {
    position: relative;
    width: min(90vw, 750px);
    transform: rotate(-3deg);
    filter: drop-shadow(0 0 4px #fff) drop-shadow(0 0 12px rgba(200,200,255,.6));
}

.signature {
    width: 100%;
    display: block;
    overflow: visible;
}

.sig-write, .sig-underline {
    fill: none;
    stroke: #fff;
    stroke-width: 5px;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 100;
    stroke-dashoffset: 100;
}

.signature.ready .sig-write,
.signature.ready .sig-underline {
    animation: drawStroke var(--t) cubic-bezier(.4,.1,.6,.9) var(--d) forwards;
}

@keyframes drawStroke { to { stroke-dashoffset: 0; } }

.enter-wrapper {
    display: inline-block;
    margin-top: 60px;
}

.enter {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    font-family: 'Nunito', sans-serif;
    font-size: 16px;
    font-weight: 800;
    letter-spacing: 2px;
    color: #fff;
    opacity: 0;
    text-shadow: 0 0 12px rgba(255,255,255,.7);
}

.enter.show { animation: showText 1s ease forwards; }

.blink-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 0 8px #fff, 0 0 20px #fff;
    animation: blink 1.1s ease-in-out infinite;
}

@keyframes blink {
    50% { opacity: .2; transform: scale(.65); }
}

@keyframes showText { to { opacity: 1; } }

/* MAIN */
.main {
    position: fixed;
    inset: 0;
    z-index: 1;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    isolation: isolate;
    opacity: 0;
    visibility: hidden;
    transition: opacity 1.2s ease;
    background: radial-gradient(ellipse at 50% 35%, #292b36 0%, #171821 48%, #08090f 100%);
}

.main.show { opacity: 1; visibility: visible; }


/* COSMIC AURORA - CHI HIEN TRONG MAIN */
.aurora-layer {
    position: absolute;
    inset: -18%;
    z-index: 1;
    pointer-events: none;
    overflow: hidden;
    opacity: 0;
    transition: opacity 1.8s ease;
    mix-blend-mode: screen;
}
body.in-main .aurora-layer { opacity: 1; }
.aurora-layer::before,
.aurora-layer::after {
    content: "";
    position: absolute;
    width: 75vw;
    height: 65vh;
    min-width: 520px;
    min-height: 420px;
    border-radius: 50%;
    filter: blur(72px);
    transform: rotate(-22deg);
    animation: auroraDrift 19s ease-in-out infinite alternate;
}
.aurora-layer::before {
    left: -12%; top: 8%;
    background: radial-gradient(ellipse, rgba(80,105,255,.19) 0%, rgba(115,75,220,.12) 38%, transparent 72%);
}
.aurora-layer::after {
    right: -14%; bottom: -4%;
    background: radial-gradient(ellipse, rgba(55,210,230,.13) 0%, rgba(112,85,255,.12) 42%, transparent 72%);
    animation-duration: 25s;
    animation-direction: alternate-reverse;
}
@keyframes auroraDrift {
    0% { transform: translate3d(-3%, -2%, 0) rotate(-22deg) scale(.92); }
    50% { transform: translate3d(5%, 4%, 0) rotate(-12deg) scale(1.08); }
    100% { transform: translate3d(1%, -5%, 0) rotate(-28deg) scale(1); }
}

/* AVATAR ENERGY ORBIT */
.avatar-wrapper::before,
.avatar-wrapper::after {
    content: "";
    position: absolute;
    inset: -8px;
    border-radius: 50%;
    pointer-events: none;
    z-index: 1;
}
.avatar-wrapper::before {
    border: 1px solid rgba(154,190,255,.72);
    border-left-color: transparent;
    border-right-color: rgba(145,115,255,.8);
    box-shadow: 0 0 9px rgba(108,145,255,.32), inset 0 0 8px rgba(100,145,255,.12);
    animation: orbitSpin 8s linear infinite;
}
.avatar-wrapper::after {
    inset: -13px;
    border: 1px dashed rgba(190,205,255,.42);
    border-top-color: rgba(95,220,255,.85);
    border-bottom-color: transparent;
    animation: orbitSpin 13s linear infinite reverse;
}
@keyframes orbitSpin { to { transform: rotate(360deg); } }
.avatar-wrapper:hover::before { box-shadow: 0 0 16px rgba(108,145,255,.65); }
@media (prefers-reduced-motion: reduce) {
    .aurora-layer::before, .aurora-layer::after,
    .avatar-wrapper::before, .avatar-wrapper::after { animation: none; }
}

/* BACKGROUND & TEXT RƠI */
.bg-gif {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: 0;
    opacity: .6;
    filter: grayscale(40%) contrast(90%);
    pointer-events: none;
}

.gray-overlay {
    position: absolute;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    background: radial-gradient(circle at center, rgba(50,50,50,0.3) 0%, rgba(20,20,20,0.7) 100%);
    mix-blend-mode: multiply;
}

/* HIỆU ỨNG CHỮ RƠI MỜ */
.falling-text-container {
    position: absolute;
    inset: 0;
    z-index: 2;
    pointer-events: none;
    overflow: hidden;
}

.falling-text {
    position: absolute;
    font-family: 'Nunito', sans-serif;
    font-size: 24px;
    font-weight: 800;
    color: rgba(255, 255, 255, 0.15);
    text-shadow: 0 0 10px rgba(255, 255, 255, 0.1);
    white-space: nowrap;
    filter: blur(1px);
    animation: fall linear infinite;
}

@keyframes fall {
    0% { transform: translateY(-100px) rotate(0deg); opacity: 0; }
    10% { opacity: 1; }
    90% { opacity: 1; }
    100% { transform: translateY(100vh) rotate(20deg); opacity: 0; }
}

/* HIỆU ỨNG TRÁI TIM VẼ NÉT TAN CHẢY */
.click-heart-svg {
    position: fixed;
    pointer-events: none;
    z-index: 150;
    width: 60px;
    height: 60px;
    transform: translate(-50%, -50%);
    animation: heartDrawAndFade 1.2s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
}

.click-heart-svg path {
    fill: transparent;
    stroke: #ffb3c6;
    stroke-width: 2.5;
    stroke-linecap: round;
    stroke-linejoin: round;
    filter: drop-shadow(0 0 10px rgba(255, 179, 198, 0.9));
    stroke-dasharray: 300;
    stroke-dashoffset: 300;
    animation: drawHeart 0.6s ease-out forwards;
}

@keyframes drawHeart {
    0% { stroke-dashoffset: 300; fill: transparent; }
    80% { stroke-dashoffset: 0; fill: transparent; }
    100% { stroke-dashoffset: 0; fill: rgba(255, 179, 198, 0.3); }
}

@keyframes heartDrawAndFade {
    0% { transform: translate(-50%, -50%) scale(0.5); opacity: 1; }
    80% { transform: translate(-50%, -50%) scale(1.5); opacity: 1; }
    100% { transform: translate(-50%, -50%) scale(2.5); opacity: 0; }
}

/* HIỆU ỨNG LẤP LÁNH (SPARKLES) */
.sparkle {
    position: absolute;
    pointer-events: none;
    width: 4px;
    height: 4px;
    background: #fff;
    border-radius: 50%;
    box-shadow: 0 0 6px #fff, 0 0 12px rgba(0, 255, 255, 0.8);
    animation: floatSparkle 4s linear infinite;
    opacity: 0;
}

@keyframes floatSparkle {
    0% { transform: translateY(0) scale(0); opacity: 0; }
    20% { opacity: 1; }
    80% { opacity: 1; }
    100% { transform: translateY(-100px) scale(1.5); opacity: 0; }
}

.glass-sheen {
    position: absolute;
    inset: 0;
    z-index: 3;
    pointer-events: none;
    background:
        radial-gradient(ellipse 60% 40% at 22% 18%, rgba(255,255,255,.1), transparent 60%),
        radial-gradient(ellipse 50% 35% at 78% 72%, rgba(180,200,255,.05), transparent 60%);
    mix-blend-mode: overlay;
}

#particles {
    position: absolute;
    inset: 0;
    z-index: 4;
    pointer-events: none;
    opacity: .6;
}

.grain {
    position: absolute;
    inset: 0;
    z-index: 5;
    pointer-events: none;
    opacity: .08;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.6'/></svg>");
    mix-blend-mode: overlay;
}

.vignette {
    position: absolute;
    inset: 0;
    z-index: 6;
    pointer-events: none;
    background: radial-gradient(ellipse 90% 75% at 50% 50%, transparent 40%, rgba(10,10,10,.5) 85%, rgba(5,5,5,.8) 100%);
}

/* PROFILE */
.profile-container {
    position: relative;
    z-index: 20;
    display: flex;
    flex-direction: column;
    gap: 16px;
    width: 100%;
    max-width: 680px;
    padding: 0 16px;
    perspective: 1000px;
    animation: floatUp .8s cubic-bezier(.2,.8,.2,1) forwards;
}

@keyframes floatUp {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
}

/* HIỆU ỨNG NGHIÊNG KHUNG */
.tilt-card {
    transform-style: preserve-3d;
    will-change: transform;
    transition: transform .15s cubic-bezier(.2,.8,.2,1);
}

.glass-card {
    position: relative;
    background: linear-gradient(135deg, rgba(255,255,255,.15), rgba(255,255,255,.02));
    backdrop-filter: blur(25px) saturate(120%);
    -webkit-backdrop-filter: blur(25px) saturate(120%);
    border: 1px solid rgba(255,255,255,.2);
    border-radius: 30px;
    box-shadow:
        0 8px 32px rgba(0,0,0,.4),
        inset 0 0 0 1px rgba(255,255,255,.1);
    overflow: hidden;
}

.main-profile {
    padding: 25px 30px;
    display: flex;
    align-items: center;
    gap: 20px;
    flex-wrap: wrap;
}

/* AVATAR */
.avatar-wrapper {
    position: relative;
    width: 95px; 
    height: 95px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    background: transparent;
    transform-style: preserve-3d;
    will-change: transform;
    transition: transform .5s cubic-bezier(.175,.885,.32,1.275);
    z-index: 1;
    overflow: visible !important;
    border: 2px solid rgba(255, 255, 255, 0.3);
    box-shadow: 0 0 15px rgba(0,0,0,0.5);
}

.avatar-img {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    object-fit: cover;
    position: relative;
    z-index: 2;
    border: none; 
    pointer-events: none;
    background: rgba(0,0,0,0.5);
}

.online-dot {
    position: absolute;
    bottom: 3px;
    right: 3px;
    width: 20px;
    height: 20px;
    background-color: #23a559;
    border-radius: 50%;
    border: 3px solid #333;
    z-index: 3;
}

/* PROFILE INFO */
.profile-info {
    display: flex;
    flex-direction: column;
    gap: 4px;
    transform: translateZ(30px);
    min-width: 0;
    flex: 1;
}

.profile-name-row {
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: 'Nunito', sans-serif;
    font-size: 36px;
    font-weight: 900;
    line-height: 1;
}

/* HIỆU ỨNG TITLE CỐ ĐỊNH CÓ @ VÀ NHIỄU */
.title-container {
    display: flex;
    align-items: center;
    color: #eee;
    text-shadow: 0 0 4px rgba(255,255,255,0.5), 0 0 10px rgba(255,255,255,0.3);
}

.title-text {
    font-weight: 900;
    position: relative;
    color: #eee;
    cursor: pointer;
    text-shadow: 0 0 4px rgba(255,255,255,0.5), 0 0 10px rgba(255,255,255,0.3);
    filter: url(#noise-filter);
    animation: glitch-flicker 0.15s infinite;
}

.title-text::before {
    content: "@ciara";
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    color: #eee;
    opacity: 0.6;
    text-shadow: 2px 0 rgba(255,0,0,0.4), -2px 0 rgba(0,255,255,0.4);
    clip-path: inset(10% 0 80% 0);
    animation: noise-clip 0.2s infinite linear alternate-reverse;
    pointer-events: none;
}

.title-text:hover {
    animation: glitch-shake 0.05s infinite;
}
.title-text:hover::before {
    opacity: 1;
    text-shadow: 4px 0 rgba(255,0,0,0.8), -4px 0 rgba(0,255,255,0.8), 2px 2px 10px rgba(255,255,255,0.5);
    animation: noise-clip-hover 0.1s infinite linear alternate-reverse;
}

@keyframes glitch-flicker {
    0% { opacity: 1; }
    50% { opacity: 0.95; }
    100% { opacity: 1; }
}

@keyframes noise-clip {
    0% { clip-path: inset(20% 0 80% 0); transform: translateX(-1px); }
    20% { clip-path: inset(60% 0 10% 0); transform: translateX(1px); }
    40% { clip-path: inset(40% 0 50% 0); transform: translateX(-1px); }
    60% { clip-path: inset(80% 0 5% 0); transform: translateX(2px); }
    80% { clip-path: inset(10% 0 70% 0); transform: translateX(-2px); }
    100% { clip-path: inset(30% 0 60% 0); transform: translateX(1px); }
}

@keyframes noise-clip-hover {
    0% { clip-path: inset(10% 0 80% 0); transform: translateX(-3px) scaleY(1.1); }
    25% { clip-path: inset(50% 0 30% 0); transform: translateX(3px) scaleY(0.9); }
    50% { clip-path: inset(30% 0 60% 0); transform: translateX(-3px) scaleY(1); }
    75% { clip-path: inset(70% 0 15% 0); transform: translateX(3px) scaleY(1.1); }
    100% { clip-path: inset(20% 0 70% 0); transform: translateX(-3px) scaleY(0.9); }
}

@keyframes glitch-shake {
    0% { transform: translate(0, 0) rotate(0deg); }
    25% { transform: translate(-1px, 1px) rotate(-1deg); }
    50% { transform: translate(1px, -1px) rotate(1deg); }
    75% { transform: translate(-1px, -1px) rotate(0deg); }
    100% { transform: translate(1px, 1px) rotate(-1deg); }
}

/* BADGE */
.profile-badges {
    display: flex;
    gap: 6px;
    background: rgba(255,255,255,.1);
    border: 1px solid rgba(255,255,255,.2);
    padding: 3px 8px;
    border-radius: 20px;
    transform: translateZ(40px);
    align-items: center;
    height: fit-content;
}

.badge-item {
    width: 18px;
    height: 18px;
    object-fit: contain;
    cursor: help;
    transition: transform .3s ease;
}

.badge-item:hover {
    transform: scale(1.15) rotate(3deg);
}

.profile-username {
    font-family: 'Inter', sans-serif;
    font-size: 16px;
    font-weight: 700;
    color: rgba(255, 255, 255, 0.7);
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 4px;
}

.profile-username svg {
    width: 18px;
    height: 18px;
    fill: currentColor;
}

/* DÒNG CHỮ GÕ */
.typing-text {
    font-family: 'Nunito', sans-serif;
    font-size: 17px; 
    font-weight: 800; 
    color: #ddd;
    min-height: 24px;
    margin-top: 6px;
    display: flex;
    align-items: center;
    text-shadow: 0 2px 8px rgba(0,0,0,.5);
}

.typing-text::after {
    content: "/";
    animation: blinkCursor 0.8s step-end infinite;
    margin-left: 6px; 
    font-weight: 800;
    opacity: 0.8;
}

@keyframes blinkCursor {
    50% { opacity: 0; }
}

/* SOCIAL ICONS */
.profile-socials {
    display: flex;
    gap: 12px;
    margin-top: 10px;
    align-items: center;
}

.social-icon {
    width: 28px;
    height: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #ccc;
    text-decoration: none;
    transition: all .3s ease;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
}

.social-icon:hover {
    color: #fff;
    transform: translateY(-4px) scale(1.1);
    filter: drop-shadow(0 4px 8px rgba(255,255,255,0.3));
}

.social-icon svg { 
    width: 100%; 
    height: 100%; 
    fill: currentColor;
    stroke: none;
}

/* FOOTER CỦA PROFILE */
.profile-footer {
    width: 100%;
    display: flex;
    justify-content: space-between; 
    align-items: center;
    border-top: 1px solid rgba(255, 255, 255, 0.1);
    padding-top: 15px;
    margin-top: 15px;
    transform: translateZ(20px);
}

/* THỜI GIAN THỰC */
.real-time-clock {
    font-family: 'Inter', sans-serif;
    font-size: 13px; 
    font-weight: 500; 
    color: rgba(255, 255, 255, 0.65); 
    text-transform: none; 
    display: flex;
    align-items: center;
    gap: 6px;
    text-shadow: 0 1px 3px rgba(0,0,0,0.5);
}

.real-time-clock span {
    text-transform: capitalize;
}

.real-time-clock svg {
    width: 14px;
    height: 14px;
    fill: currentColor;
    opacity: 0.6;
}

.footer-right {
    display: flex;
    gap: 15px;
    align-items: center;
}

.footer-item {
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: 'Inter', sans-serif;
    font-size: 14px; 
    font-weight: 600; 
    color: rgba(255, 255, 255, 0.6);
    text-shadow: 0 2px 5px rgba(0,0,0,0.5);

/* =========================================
   CỤM ĐIỀU KHIỂN ÂM THANH
   ========================================= */
.audio-controls-wrapper {
    position: fixed;
    top: 20px;
    left: 20px;
    z-index: 20;
}

.slider {
    --slider-width: 100px; 
    --slider-height: 30px; 
    --slider-bg: rgba(255, 255, 255, 0.1); 
    --slider-border-radius: 9px;
    --level-color: #fff; 
    --level-transition-duration: 0.1s;
    --icon-margin: 10px;
    --icon-color: #ccc;
    --icon-size: 24px;
    
    position: relative;
    cursor: pointer;
    display: inline-flex;
    flex-direction: row; 
    align-items: center;
    background: rgba(60, 60, 60, 0.6); 
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 12px;
    padding: 8px;
    box-shadow: 0 4px 15px rgba(0,0,0,.3);
    transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
    width: 44px; 
    height: 44px;
    overflow: hidden;
}

.slider:hover, .slider.active {
    width: 180px; 
    background: rgba(40, 40, 40, 0.8);
    border-color: rgba(255, 255, 255, 0.2);
}

.slider .volume {
    display: inline-block;
    vertical-align: top;
    color: var(--icon-color);
    width: var(--icon-size);
    height: auto;
    position: absolute; 
    left: 10px;
    pointer-events: none;
    transition: color 0.3s ease;
}

.slider:hover .volume {
    color: #fff;
}

.slider .level {
    -webkit-appearance: none;
    -moz-appearance: none;
    appearance: none;
    width: var(--slider-width);
    height: var(--slider-height);
    background: var(--slider-bg);
    overflow: hidden;
    border-radius: var(--slider-border-radius);
    -webkit-transition: height var(--level-transition-duration);
    -o-transition: height var(--level-transition-duration);
    transition: height var(--level-transition-duration);
    cursor: inherit;
    opacity: 0; 
    margin-left: 35px; 
    transition: opacity 0.3s ease;
}

.slider:hover .level, .slider.active .level {
    opacity: 1; 
}

.slider .level::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 0;
    height: 0;
    -webkit-box-shadow: -200px 0 0 200px var(--level-color);
    box-shadow: -200px 0 0 200px var(--level-color);
}
.slider .level::-moz-range-thumb {
    width: 0;
    height: 0;
    border-radius: 0;
    border: none;
    box-shadow: -200px 0 0 200px var(--level-color);
}

/* MOBILE */
@media (max-width: 600px) {
    .main-profile {

    .audio-controls-wrapper {
        top: 10px;

    }

        top: 10px;
        left: 70px;
    }
}


/* FLOWER-FLAME CUSTOM CURSOR + FLOATING LOVE WORDS */
#flower-cursor {
    position: fixed;
    left: 0; top: 0;
    width: 38px; height: 38px;
    z-index: 1005;
    pointer-events: none;
    opacity: 0;
    visibility: hidden;
    transform: translate(-50%, -50%);
    transition: opacity .25s ease, visibility .25s ease;
    filter: drop-shadow(0 0 7px rgba(255,157,90,.85));
}
body.in-main #flower-cursor { opacity: 1; visibility: visible; }
body.in-main, body.in-main * { cursor: none !important; }
#flower-cursor svg { width: 100%; height: 100%; overflow: visible; animation: flowerCursorSpin 5s linear infinite; }
#flower-cursor .petal { fill: url(#flamePetal); stroke: rgba(255,245,210,.9); stroke-width: .8; }
#flower-cursor .core { fill: #fff7cf; filter: drop-shadow(0 0 5px #ffb45e); }
@keyframes flowerCursorSpin { to { transform: rotate(360deg); } }
.floating-love-word {
    position: fixed; z-index: 1004; pointer-events: none;
    color: #fff2dc; font: 800 12px 'Nunito', sans-serif;
    letter-spacing: .35px; white-space: nowrap;
    text-shadow: 0 0 7px rgba(255,170,105,.95), 0 0 16px rgba(255,105,125,.65);
    animation: loveWordFloat 1.45s ease-out forwards;
}
@keyframes loveWordFloat {
    0% { opacity: 0; transform: translate(-50%, 0) scale(.7) rotate(-7deg); }
    15% { opacity: 1; }
    100% { opacity: 0; transform: translate(calc(-50% + var(--drift, 12px)), -68px) scale(1.12) rotate(8deg); }
}
@media (hover: none), (max-width: 700px) {
    body.in-main, body.in-main * { cursor: auto !important; }
    #flower-cursor { display: none; }
}

/* STAR NETWORK - MANG SAO QUANH CON TRO */
(() => {
    const canvas = document.getElementById('network-canvas');
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    let w = 0, h = 0, dpr = 1;
    let mx = window.innerWidth / 2, my = window.innerHeight / 2;
    let sx = mx, sy = my;
    const count = window.innerWidth < 700 ? 17 : 27;
    const nodes = Array.from({length: count}, (_, i) => ({
        angle: Math.random() * Math.PI * 2,
        radius: 24 + Math.random() * 105,
        speed: (Math.random() * .003 + .0012) * (Math.random() < .5 ? -1 : 1),
        size: .6 + Math.random() * 1.2,
        phase: Math.random() * Math.PI * 2
    }));
    function resize() {
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        w = window.innerWidth; h = window.innerHeight;
        canvas.width = Math.round(w * dpr);
        canvas.height = Math.round(h * dpr);
        canvas.style.width = w + 'px';
        canvas.style.height = h + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    window.addEventListener('resize', resize, {passive:true});
    window.addEventListener('pointermove', e => { mx = e.clientX; my = e.clientY; }, {passive:true});
    resize();
    function frame() {
        requestAnimationFrame(frame);
        ctx.clearRect(0, 0, w, h);
        if (!document.body.classList.contains('in-main')) return;
        sx += (mx - sx) * .16;
        sy += (my - sy) * .16;
        const t = performance.now();
        const pts = nodes.map(n => {
            n.angle += n.speed * 16;
            const pulse = Math.sin(t * .0015 + n.phase) * 5;
            return {x: sx + Math.cos(n.angle) * (n.radius + pulse), y: sy + Math.sin(n.angle) * (n.radius + pulse), size:n.size};
        });
        for (let i = 0; i < pts.length; i++) {
            for (let j = i + 1; j < pts.length; j++) {
                const dx = pts[i].x - pts[j].x, dy = pts[i].y - pts[j].y;
                const dist = Math.hypot(dx, dy);
                if (dist < 58) {
                    ctx.strokeStyle = `rgba(174,205,255,${(1 - dist / 58) * .22})`;
                    ctx.lineWidth = .55;
                    ctx.beginPath(); ctx.moveTo(pts[i].x, pts[i].y); ctx.lineTo(pts[j].x, pts[j].y); ctx.stroke();
                }
            }
        }
        for (const p of pts) {
            ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(235,245,255,.9)';
            ctx.shadowBlur = 7; ctx.shadowColor = 'rgba(125,175,255,.8)'; ctx.fill();
        }
        ctx.shadowBlur = 0;
    }
    frame();
})();

/* --- MULTI THREAD CURSOR: SPIRAL VORTEX TRAIL --- */
const threadCanvas = document.getElementById('thread-canvas');
const threadCtx = threadCanvas.getContext('2d');

let threadW = 0;
let threadH = 0;

let pointerX = window.innerWidth / 2;
let pointerY = window.innerHeight / 2;
let smoothX = pointerX;
let smoothY = pointerY;

const threadCount = 7;
const threadOffsets = Array.from(
    { length: threadCount },
    (_, i) => (i - (threadCount - 1) / 2) * 6
);

const trailLength = 80;
const threadTrails = Array.from(
    { length: threadCount },
    () => Array.from(
        { length: trailLength },
        () => ({ x: pointerX, y: pointerY })
    )
);

const SWIRL_SPEED = 0.04;
const FOLLOW_FORCE = 0.08;

function resizeThreads() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);

    threadW = window.innerWidth;
    threadH = window.innerHeight;

    threadCanvas.width = Math.round(threadW * dpr);
    threadCanvas.height = Math.round(threadH * dpr);
    threadCanvas.style.width = threadW + 'px';
    threadCanvas.style.height = threadH + 'px';

    threadCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

window.addEventListener('resize', resizeThreads, { passive: true });
resizeThreads();

window.addEventListener('pointermove', e => {
    pointerX = e.clientX;
    pointerY = e.clientY;
}, { passive: true });

function drawSpiralSwirl() {
    requestAnimationFrame(drawSpiralSwirl);

    const active = document.body.classList.contains('in-main');

    if (!active) {
        threadCtx.clearRect(0, 0, threadW, threadH);
        return;
    }

    smoothX += (pointerX - smoothX) * 0.4;
    smoothY += (pointerY - smoothY) * 0.4;

    threadCtx.globalCompositeOperation = 'destination-out';
    threadCtx.fillStyle = 'rgba(0, 0, 0, 0.15)';
    threadCtx.fillRect(0, 0, threadW, threadH);
    threadCtx.globalCompositeOperation = 'source-over';

    const time = performance.now() * 0.001;

    threadTrails.forEach((trail, index) => {
        const baseAngle = (index / threadCount) * Math.PI * 2;

        const headTargetX =
            smoothX + Math.cos(baseAngle + time * 2) * threadOffsets[index];
        const headTargetY =
            smoothY + Math.sin(baseAngle + time * 2) * threadOffsets[index];

        trail[0].x += (headTargetX - trail[0].x) * 0.5;
        trail[0].y += (headTargetY - trail[0].y) * 0.5;

        for (let k = 1; k < trail.length; k++) {
            const prev = trail[k - 1];
            const point = trail[k];

            const diffX = prev.x - point.x;
            const diffY = prev.y - point.y;
            const currentAngle = Math.atan2(diffY, diffX);

            const swirlAngle =
                currentAngle + SWIRL_SPEED * (1 + k * 0.02);

            const targetDist = 2 + k * 0.15;

            const newX = prev.x - Math.cos(swirlAngle) * targetDist;
            const newY = prev.y - Math.sin(swirlAngle) * targetDist;

            point.x += (newX - point.x) * FOLLOW_FORCE;
            point.y += (newY - point.y) * FOLLOW_FORCE;

            point.x += Math.sin(time * 3 + k * 0.5 + index) * 0.3;
            point.y += Math.cos(time * 3 + k * 0.5 + index) * 0.3;
        }

        threadCtx.beginPath();
        threadCtx.moveTo(trail[0].x, trail[0].y);

        for (let k = 1; k < trail.length - 1; k++) {
            const midX = (trail[k].x + trail[k + 1].x) / 2;
            const midY = (trail[k].y + trail[k + 1].y) / 2;

            threadCtx.quadraticCurveTo(
                trail[k].x,
                trail[k].y,
                midX,
                midY
            );
        }

        const tail = trail[trail.length - 1];
        const gradient = threadCtx.createLinearGradient(
            trail[0].x,
            trail[0].y,
            tail.x,
            tail.y
        );

        gradient.addColorStop(0, 'rgba(255, 255, 255, 0.9)');
        gradient.addColorStop(0.3, 'rgba(220, 235, 255, 0.5)');
        gradient.addColorStop(0.7, 'rgba(180, 200, 255, 0.15)');
        gradient.addColorStop(1, 'rgba(150, 180, 255, 0)');

        threadCtx.strokeStyle = gradient;
        threadCtx.lineWidth = 0.8;
        threadCtx.lineCap = 'round';
        threadCtx.lineJoin = 'round';
        threadCtx.shadowBlur = 0;
        threadCtx.stroke();
    });
}

/* --- HIỆU ỨNG GÕ CHỮ ĐA CÂU --- */
function typeLoop() {
    const currentPhrase = phrases[phraseIndex];
    const currentText = currentPhrase.substring(0, typeIndex);
    typingTextEl.textContent = currentText;

    let typeSpeed = isDeleting ? 40 : 80;

    if (!isDeleting && typeIndex === currentPhrase.length) {
        typeSpeed = 500; 
        isDeleting = true;
    } else if (isDeleting && typeIndex === 0) {
        isDeleting = false;
        typeSpeed = 500;
        phraseIndex = (phraseIndex + 1) % phrases.length;
    }

    if (isDeleting) {
        typeIndex--;
    } else {
        typeIndex++;
    }

    setTimeout(typeLoop, typeSpeed);
}

function buildUnderline(svg) {
    const line = svg.querySelector('.sig-underline');
    const writePath = svg.querySelector('.sig-write');
    const bbox = writePath.getBBox();
    const pad = 20;
    const x1 = bbox.x - pad;
    const x2 = bbox.x + bbox.width + pad;
    const y = bbox.y + bbox.height + 15;

    line.setAttribute('d', `M ${x1} ${y} Q ${(x1+x2)/2} ${y+10}, ${x2} ${y-20}`);
}

document.querySelectorAll('svg.signature').forEach(svg => {

// STAR TUNNEL: sao lao từ tâm ra ngoài tạo cảm giác bay xuyên không gian.
const warpCanvas = document.getElementById('warp-stars');
const warpCtx = warpCanvas ? warpCanvas.getContext('2d') : null;
let warpFrame = 0;
let warpStars = [];
let warpRunning = false;
function resizeWarpCanvas() {
    if (!warpCanvas || !warpCtx) return;
    const dpr = Math.min(window.devicePixelRatio || 1, 1.7);
    warpCanvas.width = Math.floor(window.innerWidth * dpr);
    warpCanvas.height = Math.floor(window.innerHeight * dpr);
    warpCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
function seedWarpStars() {
    const count = Math.min(230, Math.max(100, Math.floor(window.innerWidth * window.innerHeight / 6500)));
    warpStars = Array.from({ length: count }, () => ({
        angle: Math.random() * Math.PI * 2,
        depth: Math.random() * 1,
        speed: .006 + Math.random() * .014,
        size: .45 + Math.random() * 1.35
    }));
}
function stopWarpStars() {
    warpRunning = false;
    if (warpFrame) cancelAnimationFrame(warpFrame);
    warpFrame = 0;
    if (warpCtx) warpCtx.clearRect(0, 0, window.innerWidth, window.innerHeight);
}
function drawWarpStars() {
    if (!warpRunning || !warpCtx) return;
    const w = window.innerWidth, h = window.innerHeight;
    const cx = w / 2, cy = h / 2;
    warpCtx.fillStyle = 'rgba(2, 5, 16, .72)';
    warpCtx.fillRect(0, 0, w, h);
    for (const star of warpStars) {
        const old = star.depth;
        star.depth += star.speed;
        if (star.depth > 1) {
            star.depth = .015;
            star.angle = Math.random() * Math.PI * 2;
            star.speed = .006 + Math.random() * .014;
        }
        const spread = Math.pow(star.depth, 1.75) * Math.max(w, h) * .82;
        const x = cx + Math.cos(star.angle) * spread;
        const y = cy + Math.sin(star.angle) * spread;
        const prevSpread = Math.pow(Math.max(.005, old), 1.75) * Math.max(w, h) * .82;
        const px = cx + Math.cos(star.angle) * prevSpread;
        const py = cy + Math.sin(star.angle) * prevSpread;
        const alpha = Math.min(.95, .18 + star.depth * .9);
        warpCtx.strokeStyle = `rgba(218,235,255,${alpha})`;
        warpCtx.lineWidth = star.size * (.45 + star.depth * 1.15);
        warpCtx.beginPath();
        warpCtx.moveTo(px, py);
        warpCtx.lineTo(x, y);
        warpCtx.stroke();
        if (star.depth > .82) {
            warpCtx.fillStyle = `rgba(255,255,255,${alpha})`;
            warpCtx.beginPath();
            warpCtx.arc(x, y, star.size * 1.1, 0, Math.PI * 2);
            warpCtx.fill();
        }
    }
    warpFrame = requestAnimationFrame(drawWarpStars);
}
function startWarpStars() {
    if (!warpCtx) return;
    stopWarpStars();
    resizeWarpCanvas();
    seedWarpStars();
    warpCtx.clearRect(0, 0, window.innerWidth, window.innerHeight);
    warpRunning = true;
    drawWarpStars();
    window.setTimeout(stopWarpStars, 2150);
}
window.addEventListener('resize', () => { if (warpRunning) resizeWarpCanvas(); });

function enterSite() {
    if (entered) return;
    entered = true;

    const warp = document.getElementById('warp-transition');

/* CARD TILT */
const tiltCards = document.querySelectorAll('.tilt-card');

tiltCards.forEach(card => {
    card.addEventListener('mousemove', e => {
        const rect = card.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        const centerX = rect.width / 2;
        const centerY = rect.height / 2;
        const rotateX = ((y - centerY) / centerY) * -5;
        const rotateY = ((x - centerX) / centerX) * 5;

        card.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale(1.01)`;
    });

    card.addEventListener('mouseleave', () => {
        card.style.transform = 'perspective(1000px) rotateX(0deg) rotateY(0deg) scale(1)';
    });
});

/* AVATAR MAGNET */
const magnet = document.getElementById('avatar-magnet');
const profileCard = document.querySelector('.main-profile');
const MAGNET_RADIUS = 68;

profileCard.addEventListener('mousemove', e => {
    const rect = magnet.getBoundingClientRect();
    const centerX = rect.left + rect.width / 2;
    const centerY = rect.top + rect.height / 2;
    const distX = e.clientX - centerX;
    const distY = e.clientY - centerY;
    const distance = Math.hypot(distX, distY);

    if (distance < MAGNET_RADIUS) {
        magnet.style.transition = 'transform .12s ease-out';
        magnet.style.transform = `translate(${distX * .12}px, ${distY * .12}px) scale(1.04)`;
    } else {
        magnet.style.transition = 'transform .35s cubic-bezier(.175,.885,.32,1.275)';
        magnet.style.transform = 'translate(0px, 0px) scale(1)';
    }
});

profileCard.addEventListener('mouseleave', () => {
    magnet.style.transition = 'transform .35s cubic-bezier(.175,.885,.32,1.275)';
    magnet.style.transform = 'translate(0px, 0px) scale(1)';
});

/* PARTICLES */
(() => {
    const canvas = document.getElementById('particles');
    const ctx = canvas.getContext('2d', { alpha: true });
    const mainEl = document.getElementById('main');

    const isMobile = window.innerWidth < 700;
    const PARTICLE_COUNT = isMobile ? 30 : 50;

    const PALETTE = [
        {r:201,g:198,b:232},
        {r:150,g:120,b:255},
        {r:79,g:214,b:232},
        {r:255,g:255,b:255}
    ];

    let W = 0;
    let H = 0;
    let DPR = Math.min(window.devicePixelRatio || 1, 2);
    let particles = [];
    let rafId = null;

    const pointer = { tx: 0, ty: 0, cx: 0, cy: 0 };

    function resize() {
        W = mainEl.clientWidth;
        H = mainEl.clientHeight;
        canvas.width = W * DPR;
        canvas.height = H * DPR;
        canvas.style.width = W + 'px';
        canvas.style.height = H + 'px';
        ctx.setTransform(DPR,0,0,DPR,0,0);
    }

    function makeParticle() {
        const color = PALETTE[Math.floor(Math.random()*PALETTE.length)];
        return {
            x: Math.random()*W,
            y: Math.random()*H,
            r: Math.random()*1.5+.5,
            vx: (Math.random()-.5)*.1,
            vy: -(Math.random()*.15+.05),
            a: Math.random()*.5+.15,
            tw: Math.random()*Math.PI*2,
            twSpeed: Math.random()*.01+.005,
            color
        };
    }

    function init() {
        particles = [];
        for (let i=0; i<PARTICLE_COUNT; i++) {
            particles.push(makeParticle());
        }
    }

    window.addEventListener('mousemove', e => {
        pointer.tx = (e.clientX/window.innerWidth-.5)*2;
        pointer.ty = (e.clientY/window.innerHeight-.5)*2;
    }, { passive: true });

    function tick() {
        pointer.cx += (pointer.tx-pointer.cx)*.06;
        pointer.cy += (pointer.ty-pointer.cy)*.06;
        ctx.clearRect(0,0,W,H);
        for (const p of particles) {
            p.x += p.vx + pointer.cx*.15*p.r;
            p.y += p.vy + pointer.cy*.15*p.r;
            p.tw += p.twSpeed;
            if (p.y < -10) { p.y = H+10; p.x = Math.random()*W; }
            if (p.x < -10) p.x = W+10;
            if (p.x > W+10) p.x = -10;
            const alpha = p.a*(.6+.4*Math.sin(p.tw));
            ctx.beginPath();
            ctx.fillStyle = `rgba(${p.color.r},${p.color.g},${p.color.b},${alpha})`;
            ctx.shadowBlur = 8;
            ctx.shadowColor = `rgba(${p.color.r},${p.color.g},${p.color.b},${alpha})`;
            ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
            ctx.fill();
        }
        ctx.shadowBlur = 0;
        rafId = requestAnimationFrame(tick);
    }

    resize();
    init();

    mainEl.addEventListener('transitionend', event => {
        if (event.propertyName === 'opacity' && mainEl.classList.contains('show') && !document.hidden && !rafId) {
            rafId = requestAnimationFrame(tick);
        }
    });

    window.addEventListener('resize', () => { resize(); init(); });

    document.addEventListener('visibilitychange', () => {
        if (document.hidden) {
            if (rafId) cancelAnimationFrame(rafId);
            rafId = null;
        } else if (!rafId && mainEl.classList.contains('show')) {
            rafId = requestAnimationFrame(tick);
        }
    });
})();
</script>
